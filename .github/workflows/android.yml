name: android
# All four Starling APKs, on GitHub's runners: branch pushes and pull requests build each ABI and keep it
# as an artifact, signed with the debug key in STARLING_DEBUG_KEYSTORE_BASE64 so one installs over another (a
# throwaway key where that secret is missing, as in a fork's pull request). A tag v* signs it with the release key held
# in the secrets of the `release` environment (STARLING_KEYSTORE_BASE64, STARLING_KEY_ALIAS, STARLING_STORE_PASSWORD,
# STARLING_KEY_PASSWORD) and publishes it as the latest release, with packaging/android/release-notes.md. The APK holds
# no game files: players prepare those from their own copy.
#
# The release key is starling-client/starling's, in its `release` environment, which only the protected `starling`
# branch and v* tags reach (a ruleset lets only admins push those tags); JuanLuci/starling held it before. Every other
# build, and every build elsewhere, is Starling Preview (io.github.juanluci.starling.preview, build_apk.py --preview),
# installed beside the release and signed with the repository's own test key in STARLING_DEBUG_KEYSTORE_BASE64 (alias
# horizon-debug, password android); a tag elsewhere publishes nothing.
on:
  push:
    branches: [android, starling, integration]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      keep_symbols:
        description: Ship the library unstripped, for a profiler (simpleperf) to name its functions
        type: boolean
        default: false
      release_key:
        description: Build as a release does (release key, fast profile) without publishing, to install over a release; kept a day
        type: boolean
        default: false
      native_mods:
        description: A test with these native mods of native-mods/ compiled in (ids, separated by spaces), by native_build.sh
        type: string
        default: ''
      wasm_probe:
        description: Also build packaging/android/wasm-probe, a wasm mod that says its hooks ran, as an artifact (arm64)
        type: boolean
        default: false
permissions:
  contents: read
env:
  RELEASE_BUILD: ${{ (github.repository == 'starling-client/starling' && (startsWith(github.ref, 'refs/tags/v') || inputs.release_key)) && 'true' || 'false' }}
  PREVIEW: ${{ !(github.repository == 'starling-client/starling' && (startsWith(github.ref, 'refs/tags/v') || inputs.release_key)) && 'true' || 'false' }}
concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  apk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: arm64-v8a, target: aarch64-linux-android }
          - { abi: armeabi-v7a, target: armv7-linux-androideabi }
          - { abi: x86, target: i686-linux-android }
          - { abi: x86_64, target: x86_64-linux-android }
    # The release key's environment, for a release build only (none otherwise).
    environment: ${{ (github.repository == 'starling-client/starling' && (startsWith(github.ref, 'refs/tags/v') || inputs.release_key)) && 'release' || '' }}
    runs-on: ubuntu-latest
    # A release's fast profile builds slower (fewer codegen units, fewer at once: below).
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # JDK 25 compiles/link-checks original exporters; the build-tools supply d8/apksigner.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install the build-tools, platform and NDK build_apk.py pins
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "build-tools;35.0.0" "platforms;android-36" "ndk;28.2.13676358" > /dev/null
      - name: Install Rust for Android and cargo-ndk
        run: |
          # The Rust Horizon pins (tools/ci/rust-version), as its CI and the launcher's native mods build with.
          # rust-src: build_apk.py builds the std with the game (its TLS_FLAGS).
          bash tools/ci/rustup_install.sh --profile minimal --component rust-src --target ${{ matrix.target }}
          cargo install cargo-ndk --version 3.5.4 --locked
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-${{ matrix.abi }}
          save-if: ${{ github.ref == 'refs/heads/android' || github.ref == 'refs/heads/starling' }}
      - name: Unpack the release key
        if: env.RELEASE_BUILD == 'true'
        env:
          KEYSTORE: ${{ secrets.STARLING_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo "STARLING_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/starling-release.jks"
          echo "HORIZON_ANDROID_KEYSTORE=$RUNNER_TEMP/starling-release.jks" >> "$GITHUB_ENV"
      # The fast profile's 16 codegen units of the game's crate took more than the runner's 16 GB, and the runner
      # went: swap, on the large temporary disk where there is one, and three units at a time instead of four.
      - name: Make room for the release build
        if: env.RELEASE_BUILD == 'true'
        run: |
          sudo swapoff -a || true
          where=/mnt size=20G
          avail=$(df --output=avail -BG "$where" 2>/dev/null | tail -1 | tr -dc 0-9)
          if [ "${avail:-0}" -lt 30 ]; then where=$RUNNER_TEMP size=10G; fi
          sudo fallocate -l "$size" "$where/release.swap"
          sudo chmod 600 "$where/release.swap"
          sudo mkswap "$where/release.swap" > /dev/null
          sudo swapon "$where/release.swap"
          free -h
          echo "CARGO_BUILD_JOBS=3" >> "$GITHUB_ENV"
      # Where build_apk.py keeps its debug key (alias horizon-debug, password android).
      - name: Unpack the debug key
        if: env.RELEASE_BUILD != 'true'
        env:
          KEYSTORE: ${{ secrets.STARLING_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || exit 0
          mkdir -p target/android
          echo "$KEYSTORE" | base64 -d > target/android/debug.keystore
      # Compile v2: the arm64 APK's game is a set of Rust libraries (the mod API's crates and the mod host among
      # them), so a native mod plays from a small library of its own beside them, which mod-builds' store builds
      # for this commit and profile (its store-base.yml runs this same build). The other ABIs have no store.
      - name: The game and the mod API as dylibs
        if: matrix.abi == 'arm64-v8a' && !inputs.native_mods
        run: python3 tools/android_native_sdk.py prepare
      - name: Build the APK
        env:
          RUSTFLAGS: ${{ matrix.abi == 'arm64-v8a' && !inputs.native_mods && '-C prefer-dynamic' || '' }}
          ABI: ${{ matrix.abi }}
          HORIZON_ANDROID_KEY_ALIAS: ${{ env.RELEASE_BUILD == 'true' && secrets.STARLING_KEY_ALIAS || 'horizon-debug' }}
          HORIZON_ANDROID_STORE_PASSWORD: ${{ secrets.STARLING_STORE_PASSWORD }}
          HORIZON_ANDROID_KEY_PASSWORD: ${{ secrets.STARLING_KEY_PASSWORD }}
          MODS: ${{ inputs.native_mods }}
          PROFILE: ${{ env.RELEASE_BUILD == 'true' && 'fast' || 'quick' }}
          VARIANT: ${{ env.PREVIEW == 'true' && '--preview' || '' }}
        # Releases with the fast profile (fewer codegen units: a little quicker in game). With native mods, the APK
        # native_build.sh makes, named after them.
        run: |
          if [ -z "$MODS" ]; then
            python packaging/android/build_apk.py --abi "$ABI" --profile "$PROFILE" $VARIANT ${{ inputs.keep_symbols && '--keep-symbols' || '' }}
            exit 0
          fi
          bundles=()
          for id in $MODS; do
            [[ "$id" =~ ^[a-z0-9][a-z0-9_-]*$ && -f "native-mods/$id/mixins/$id/horizon-mixin.toml" ]] || \
              { echo "$id is not a mod of native-mods/"; exit 1; }
            bundles+=("native-mods/$id/mixins/$id")
          done
          bash packaging/android/native_build.sh . "$RUNNER_TEMP/native" "${bundles[@]}"
          mkdir -p target/android
          for apk in "$RUNNER_TEMP"/native/starling-*.apk; do
            cp "$apk" "target/android/$(basename "${apk%.apk}")-$(echo $MODS | tr ' ' '-').apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: starling-apk-${{ matrix.abi }}
          path: target/android/starling-*.apk
          if-no-files-found: error
          # A test build with the release key installs over a release: anyone may download a public
          # repository's artifacts, so it goes after a day.
          retention-days: ${{ inputs.release_key && 1 || 90 }}
      # The library with its symbols, to read the frames of native crashes in diagnostic ZIPs
      # (docs/android-diagnostics.md). Builds with native mods don't make one.
      - uses: actions/upload-artifact@v4
        with:
          name: starling-symbols-${{ matrix.abi }}
          path: target/android/lib*-symbols.so
          if-no-files-found: ignore
          retention-days: 90
      # With the cargo-horizon-mod and the Rust build_apk.py built the wasm std with (build_apk.py `wasm_std`).
      - name: Build the wasm probe mod
        if: inputs.wasm_probe && matrix.abi == 'arm64-v8a'
        working-directory: packaging/android/wasm-probe
        run: ../../../target/debug/cargo-horizon-mod horizon-mod build --wasm
      - uses: actions/upload-artifact@v4
        if: inputs.wasm_probe && matrix.abi == 'arm64-v8a'
        with:
          name: starling-wasm-probe
          path: packaging/android/wasm-probe/target/horizon-mod/*.hmod
          if-no-files-found: error

  # Fork delivery: the upstream release job only runs on starling-client/starling at a v* tag.
  # On this fork we instead publish every APK the matrix just built as assets of a public
  # release, so they can be downloaded straight from the browser without signing in.
  release:
    needs: apk
    if: github.repository != 'starling-client/starling'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v0.9.0-chinese
    steps:
      - uses: actions/checkout@v4
      - name: Download the APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: starling-apk-*
          path: target/android
          merge-multiple: true
      - name: Publish the APKs as a public release
        run: |
          ls -l target/android
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" target/android/starling-*.apk \
            --title "Starling 0.9.0 中文版（BMCLAPI 加速下载 + 中文界面）" \
            --notes "自动构建：中文界面 + BMCLAPI 多线程下载加速。arm64-v8a 为大多数现代手机使用。" \
            --latest
